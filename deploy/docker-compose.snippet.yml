# Add this service to the docker-compose.yml that already runs rmfakecloud.
# It assumes rmfakecloud's service is called "rmfakecloud" and listens on 3000 inside the network.
# Update later with: docker compose pull rmzotero && docker compose up -d rmzotero
services:
  rmzotero:
    image: ghcr.io/zsrobinson/rmzotero:latest
    pull_policy: always                  # check for a newer image every time the project starts or builds
    restart: unless-stopped
    depends_on:
      - rmfakecloud
    volumes:
      - ./rmzotero/config:/config:ro     # holds rmzotero.toml
      - ./rmzotero/data:/data            # state, the exact-page archive, device token
    ports:
      - "8787:8787"                      # the plugin API; put it behind your tunnel/reverse proxy with HTTPS
      - "8788:8788"                      # the Claude connector (only if [claude] secret is set); also behind HTTPS
    # environment:
    #   PUID: "1026"                      # run as this user/group; default: the owner of ./rmzotero/data
    #   PGID: "100"
    #   RMZOTERO_OCR_LANGUAGE: "eng+deu"  # tesseract languages (only English is in the image)
    #   FLEET_OTLP_LOGS_URL: "http://100.100.74.90:4318/v1/logs"  # optional: push content-free MCP call metadata to the fleet collector (README, Telemetry)

  # Zotero's own metadata engine, used by the Claude connector to add items from DOIs, ISBNs and URLs.
  # Built for amd64 and arm64 by this repo's translation-server workflow (Zotero's own image is arm64-only).
  translation-server:
    image: ghcr.io/zsrobinson/translation-server:latest
    pull_policy: always
    restart: unless-stopped
