[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmzotero"
version = "0.4.0"
description = "Two-way sync between a Zotero library and a reMarkable tablet via rmfakecloud"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "rmscene>=0.7",
  "pikepdf>=8",
  "pypdfium2>=4",
  "typst>=0.11",
  "mcp==1.30.0",
  "PyJWT[crypto]>=2.15.1,<3",
  "uvicorn>=0.30",
  "pillow>=10",
  "readability-lxml>=0.8.1",
  "lxml_html_clean>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rmzotero = "rmzotero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
